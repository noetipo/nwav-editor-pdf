spring.application.name=nwav-editor-pdf
spring.main.web-application-type=none
spring.main.banner-mode=off

nwav.datos.carpeta=${user.home}/.nwav-editor-pdf
nwav.datos.archivo=nwav_editor.db

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=nwav_flyway_historial

logging.level.root=WARN
logging.level.com.nwav.editorpdf=INFO
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
