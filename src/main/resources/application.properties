spring.application.name=nwav-editor-pdf
# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite en la carpeta de datos del usuario (se crea al arrancar).
# El DataSource lo construye NwavBaseDatosConfig: una sola conexion y modo WAL.
nwav.datos.carpeta=${user.home}/.nwav-editor-pdf
nwav.datos.archivo=nwav_editor.db

# JPA / Hibernate: el esquema lo gestiona Flyway, nunca Hibernate.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migraciones versionadas (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=nwav_flyway_historial

# Registro de actividad
logging.level.root=WARN
logging.level.com.nwav.editorpdf=INFO
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
