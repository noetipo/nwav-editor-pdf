name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: ZIP portable para Windows (con pruebas)
        run: empaquetado/construir-windows.sh

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" target/NWAV-Editor-PDF-*-windows-x64.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file empaquetado/notas-release.md
          else
            gh release create "$GITHUB_REF_NAME" target/NWAV-Editor-PDF-*-windows-x64.zip \
              --title "NWAV Editor PDF $GITHUB_REF_NAME" \
              --notes-file empaquetado/notas-release.md
          fi
