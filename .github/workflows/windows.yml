# Compila y pasa TODAS las pruebas en Windows, y genera el instalador y la version portable.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas en Windows
        run: .\mvnw.cmd -B test

      - name: Publicar los fallos de las pruebas como anotaciones
        if: failure()
        shell: pwsh
        run: |
          $n = 0
          Get-ChildItem target/surefire-reports -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$x = Get-Content $_.FullName -Raw
            foreach ($c in $x.testsuite.testcase) {
              foreach ($f in @($c.failure) + @($c.error)) {
                if ($f -and $n -lt 10) {
                  $n++
                  $texto = (($f.message + "`n" + $f.'#text') -split "`n" | Select-Object -First 12) -join '%0A'
                  Write-Output "::error title=$($c.classname).$($c.name)::$texto"
                }
              }
            }
          }

      - name: WiX Toolset (para el instalador .exe)
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        continue-on-error: true

      - name: Instalador
        run: powershell -ExecutionPolicy Bypass -File empaquetado\instalador-windows.ps1 -SinPruebas

      - uses: actions/upload-artifact@v5
        with:
          name: nwav-editor-pdf-windows
          path: |
            target/instalador/*.exe
            target/instalador/*.zip
          if-no-files-found: warn

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: informes-de-pruebas
          path: target/surefire-reports/
